<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FakeApp Web — Fixture</title>
  </head>
  <body>
    <div id="app">
      <!-- QR Login page (default state) -->
      <div id="qr-page" role="main" aria-label="QR Login">
        <h1>FakeApp Web</h1>
        <p>Scan the QR code with your phone to log in</p>
        <div aria-label="QR Code" role="img" data-testid="qr-code">
          <div
            style="
              width: 200px;
              height: 200px;
              background: #ccc;
              text-align: center;
              line-height: 200px;
            "
          >
            QR
          </div>
        </div>
      </div>

      <!-- Logged-in chat view (hidden by default) -->
      <div id="chat-view" role="main" aria-label="Chat" style="display: none">
        <nav role="navigation" aria-label="Chat filters">
          <button role="tab" aria-label="All" aria-selected="true" data-filter="all">
            All
          </button>
          <button
            role="tab"
            aria-label="Groups"
            aria-selected="false"
            data-filter="groups"
            id="groups-filter"
          >
            Groups
          </button>
        </nav>

        <div id="chat-list" role="list" aria-label="Chat list">
          <div
            role="listitem"
            aria-label="מכירות תל אביב"
            data-testid="group-item"
            data-group="selling-tlv"
          >
            <span>מכירות תל אביב</span>
          </div>
          <div
            role="listitem"
            aria-label="יד שנייה חיפה"
            data-testid="group-item"
            data-group="selling-haifa"
          >
            <span>יד שנייה חיפה</span>
          </div>
          <div
            role="listitem"
            aria-label="קניה מסירה ירושלים"
            data-testid="group-item"
            data-group="selling-jlm"
          >
            <span>קניה מסירה ירושלים</span>
          </div>
          <div
            role="listitem"
            aria-label="Family Chat"
            data-testid="group-item"
            data-group="family"
          >
            <span>Family Chat</span>
          </div>
          <div
            role="listitem"
            aria-label="Work Team"
            data-testid="group-item"
            data-group="work"
          >
            <span>Work Team</span>
          </div>
        </div>

        <!-- Group conversation view -->
        <div
          id="group-conversation"
          style="display: none"
          role="main"
          aria-label="Group conversation"
        >
          <div id="group-name" aria-label="Group name"></div>
          <div
            role="textbox"
            aria-label="Type a message"
            contenteditable="true"
            id="message-input"
          ></div>
          <input
            type="file"
            id="attachment-input"
            multiple
            accept="image/*"
            aria-label="Attach media"
            style="display: none"
          />
          <button aria-label="Attach" role="button" id="attach-btn">📎</button>
          <button aria-label="Send" role="button" id="send-btn">Send</button>
          <div id="send-result" style="display: none" aria-label="Send result">
            <span id="send-status">not_sent</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("state") === "logged_in") {
        document.getElementById("qr-page").style.display = "none";
        document.getElementById("chat-view").style.display = "block";
      }

      document.getElementById("groups-filter")?.addEventListener("click", () => {
        // Filter to show only groups (items with Hebrew sale-related names)
        document.querySelectorAll('[data-testid="group-item"]').forEach((el) => {
          const name = el.getAttribute("aria-label") || "";
          const isSaleGroup = /מכיר|קני|מסיר|יד\s*שני/i.test(name);
          el.style.display = "block"; // Show all groups when Groups filter is clicked
        });
      });

      document.querySelectorAll('[data-testid="group-item"]').forEach((el) => {
        el.addEventListener("click", () => {
          document.getElementById("chat-list").style.display = "none";
          document.getElementById("group-conversation").style.display = "block";
          document.getElementById("group-name").textContent =
            el.getAttribute("aria-label");
        });
      });

      document.getElementById("attach-btn")?.addEventListener("click", () => {
        document.getElementById("attachment-input").click();
      });

      document.getElementById("send-btn")?.addEventListener("click", () => {
        document.getElementById("send-result").style.display = "block";
        document.getElementById("send-status").textContent = "sent";
      });
    </script>
  </body>
</html>
