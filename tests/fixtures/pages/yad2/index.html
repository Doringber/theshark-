<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>FakeYad2 — Fixture</title>
  </head>
  <body>
    <div id="app">
      <!-- Login page (default state) -->
      <div id="login-page" role="main" aria-label="Login">
        <h1>התחברות ל-FakeYad2</h1>
        <form aria-label="Login form">
          <label for="email">אימייל</label>
          <input id="email" type="email" aria-label="אימייל" />
          <label for="pass">סיסמה</label>
          <input id="pass" type="password" aria-label="סיסמה" />
          <button type="submit" role="button" aria-label="התחברות">התחברות</button>
        </form>
      </div>

      <!-- Logged-in publish page (hidden by default) -->
      <div id="publish-page" role="main" aria-label="Publish" style="display: none">
        <h1>פרסום מודעה</h1>
        <nav role="navigation" aria-label="Ad categories">
          <a href="/yad2/products.html" role="link" aria-label="מוצרים">מוצרים</a>
          <a href="#" role="link" aria-label="נדל״ן">נדל״ן</a>
          <a href="#" role="link" aria-label="רכב">רכב</a>
        </nav>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("state") === "logged_in") {
        document.getElementById("login-page").style.display = "none";
        document.getElementById("publish-page").style.display = "block";
      }
    </script>
  </body>
</html>
