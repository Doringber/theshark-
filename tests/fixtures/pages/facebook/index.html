<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FakeBook — Fixture</title>
  </head>
  <body>
    <div id="app">
      <!-- Login page (default state) -->
      <div id="login-page" role="main" aria-label="Login">
        <h1>Log into FakeBook</h1>
        <form aria-label="Login form">
          <label for="email">Email</label>
          <input id="email" type="email" aria-label="Email" />
          <label for="pass">Password</label>
          <input id="pass" type="password" aria-label="Password" />
          <button type="submit" role="button" aria-label="Log In">Log In</button>
        </form>
      </div>

      <!-- Logged-in home (hidden by default) -->
      <div id="home-page" role="main" aria-label="Home" style="display: none">
        <nav role="navigation" aria-label="Main navigation">
          <a href="/facebook/marketplace.html" role="link" aria-label="Marketplace"
            >Marketplace</a
          >
        </nav>
        <div aria-label="User menu">
          <span data-testid="user-name">Test User</span>
        </div>
      </div>
    </div>

    <script>
      // Simulate login state via query param: ?state=logged_in
      const params = new URLSearchParams(window.location.search);
      if (params.get("state") === "logged_in") {
        document.getElementById("login-page").style.display = "none";
        document.getElementById("home-page").style.display = "block";
      }
    </script>
  </body>
</html>
