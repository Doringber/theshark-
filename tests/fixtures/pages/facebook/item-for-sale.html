<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FakeBook — Item for Sale — Fixture</title>
  </head>
  <body>
    <div id="item-form" role="main" aria-label="Item for sale form">
      <h1>Item for sale</h1>
      <form aria-label="Item details">
        <div>
          <label for="photos">Photos</label>
          <input
            id="photos"
            type="file"
            multiple
            accept="image/*"
            aria-label="Add photos"
          />
          <div id="photo-preview" aria-label="Photo preview"></div>
          <span aria-label="Photo limit">Up to 10 photos</span>
        </div>
        <div>
          <label for="title">Title</label>
          <input id="title" type="text" required aria-label="Title" />
        </div>
        <div>
          <label for="price">Price</label>
          <input id="price" type="number" required aria-label="Price" />
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category" aria-label="Category">
            <option value="">Select category</option>
            <option value="electronics">Electronics</option>
            <option value="furniture">Furniture</option>
            <option value="clothing">Clothing</option>
          </select>
        </div>
        <div>
          <label for="condition">Condition</label>
          <select id="condition" aria-label="Condition">
            <option value="new">New</option>
            <option value="like_new">Used – Like new</option>
            <option value="good">Used – Good</option>
            <option value="fair">Used – Fair</option>
          </select>
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" aria-label="Description"></textarea>
        </div>
        <div>
          <label for="location">Location</label>
          <input id="location" type="text" aria-label="Location" />
        </div>
        <button type="button" id="next-btn" role="button" aria-label="Next">
          Next
        </button>
      </form>
    </div>

    <!-- Destination selection (shown after Next) -->
    <div
      id="destination-page"
      style="display: none"
      role="main"
      aria-label="Choose destinations"
    >
      <h2>Where to publish</h2>
      <div role="group" aria-label="Publishing destinations">
        <label
          ><input
            type="checkbox"
            name="dest"
            value="marketplace"
            checked
            aria-label="Marketplace"
          />
          Marketplace</label
        >
        <label
          ><input
            type="checkbox"
            name="dest"
            value="buy-sell-tlv"
            aria-label="Buy & Sell TLV"
          />
          Buy & Sell TLV</label
        >
      </div>
      <button type="button" id="publish-btn" role="button" aria-label="Publish">
        Publish
      </button>
    </div>

    <!-- Result tracking -->
    <div id="result" style="display: none" aria-label="Result">
      <span id="publish-status">not_published</span>
    </div>

    <script>
      document.getElementById("next-btn").addEventListener("click", () => {
        document.getElementById("item-form").style.display = "none";
        document.getElementById("destination-page").style.display = "block";
      });
      document.getElementById("publish-btn").addEventListener("click", () => {
        document.getElementById("destination-page").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("publish-status").textContent = "published";
      });
    </script>
  </body>
</html>
